<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            margin: 20px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .language-selector select {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 25px;
            background: white;
            color: #667eea;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .language-selector select:hover {
            background: #667eea;
            color: white;
        }

        .icon-container {
            margin-bottom: 30px;
        }

        .gear-icon {
            width: 120px;
            height: 120px;
            position: relative;
            display: inline-block;
        }

        .gear {
            position: absolute;
            border-radius: 50%;
            border: 8px solid #667eea;
        }

        .gear-large {
            width: 80px;
            height: 80px;
            top: 20px;
            left: 0;
            animation: rotateCW 4s linear infinite;
        }

        .gear-small {
            width: 50px;
            height: 50px;
            top: 35px;
            right: 0;
            border-color: #f5576c;
            animation: rotateCCW 3s linear infinite;
        }

        .gear::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15px;
            height: 15px;
            background: currentColor;
            border-radius: 50%;
        }

        .gear-large::before { background: #667eea; }
        .gear-small::before { background: #f5576c; }

        @keyframes rotateCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .message {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .progress-container {
            background: #e0e0e0;
            border-radius: 25px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #f5576c);
            border-radius: 25px;
            width: 0%;
            animation: loading 3s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .status {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 25px;
            font-weight: 600;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .shape:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 60px; height: 60px; left: 20%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 100px; height: 100px; left: 70%; animation-delay: 4s; }
        .shape:nth-child(4) { width: 40px; height: 40px; left: 80%; animation-delay: 6s; }
        .shape:nth-child(5) { width: 120px; height: 120px; left: 50%; animation-delay: 8s; }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="container">
        <div class="language-selector">
            <select id="languageSelect" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="ar">العربية</option>
                <option value="hi">हिंदी</option>
                <option value="sw">Kiswahili</option>
                <option value="rw">Kinyarwanda</option>
                <option value="ht">Kreyòl Ayisyen</option>
                <option value="nl">Nederlands</option>
                <option value="sv">Svenska</option>
                <option value="da">Dansk</option>
                <option value="no">Norsk</option>
                <option value="fi">Suomi</option>

                <option value="tr">Türkçe</option>
                <option value="th">ไทย</option>

        </div>

        <div class="icon-container">
            <div class="gear-icon">
                <div class="gear gear-large"></div>
                <div class="gear gear-small"></div>
            </div>
        </div>

        <h1 id="title">Under Maintenance</h1>
        <p class="message" id="message">We're currently performing scheduled maintenance to improve your experience. We'll be back shortly!</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="status" id="status">Working on it...</div>
    </div>

                status: "Turimo gukora..."
            },
            ht: {

                message: "Nou ap fè antretyen pwograme pou amelyore eksperyans ou. Nou pral tounen byento!",
                status: "N ap travay sou li..."
            },
            nl: {

                message: "We voeren momenteel gepland onderhoud uit om uw ervaring te verbeteren. We zijn zo terug!",
                status: "We werken eraan..."
            },
            sv: {

                message: "Vi utför för närvarande schemalagt underhåll för att förbättra din upplevelse. Vi är snart tillbaka!",
                status: "Arbetar på det..."
            },
            da: {

                status: "Arbejder på det..."

            no: {

                status: "Jobber med det..."

            fi: {

                status: "Työskentelemme..."
            },
            pl: {

                message: "Obecnie przeprowadzamy zaplanowaną konserwację, aby poprawić Twoje doświadczenie. Wkrótce wrócimy!",
                status: "Pracujemy nad tym..."
            },
            tr: {
                title: "Bakım Çalışması",
                message: "Deneyiminizi iyileştirmek için şu anda planlı bakım yapıyoruz. Yakında geri döneceğiz!",
                status: "Üzerinde çalışıyoruz..."
            },
            th: {
                title: "อยู่ระหว่างการบำรุงรักษา",
                message: "ขณะนี้เรากำลังดำเนินการบำรุงรักษาตามกำหนดเพื่อปรับปรุงประสบการณ์ของคุณ เราจะกลับมาเร็วๆ นี้!",
                status: "กำลังดำเนินการ..."
            },
            vi: {
                title: "Đang Bảo Trì",
                message: "Chúng tôi hiện đang thực hiện bảo trì theo lịch trình để cải thiện trải nghiệm của bạn. Chúng tôi sẽ sớm quay lại!",
                status: "Đang xử lý..."
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('message').textContent = t.message;
            document.getElementById('status').textContent = t.status;
            document.documentElement.lang = lang;
            
            if (lang === 'ar') {
                document.body.style.direction = 'rtl';
            } else {
                document.body.style.direction = 'ltr';
            }
        }

        document.getElementById('languageSelect').value = 'en';
    </script>
</body>
</html>

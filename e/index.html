<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            background: #0a0a0f;
            color: #00ff88;
            overflow: hidden;
            position: relative;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.1;
        }

        .grid-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        .container {
            text-align: center;
            padding: 50px;
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid #00ff88;
            border-radius: 5px;
            max-width: 700px;
            margin: 20px;
            position: relative;
            z-index: 10;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.3),
                inset 0 0 20px rgba(0, 255, 136, 0.05);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ff88, #00ccff, #ff00ff, #00ff88);
            background-size: 400% 400%;
            z-index: -1;
            border-radius: 6px;
            animation: borderGlow 3s ease infinite;
            opacity: 0.5;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .language-selector {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .language-selector select {
            padding: 8px 15px;
            border: 1px solid #00ff88;
            background: transparent;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .language-selector select:hover {
            background: #00ff88;
            color: #0a0a0f;
        }

        .language-selector select option {
            background: #0a0a0f;
            color: #00ff88;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27ca40; }

        .terminal-title {
            margin-left: auto;
            font-size: 12px;
            color: #666;
        }

        .server-icon {
            margin: 30px auto;
            width: 100px;
            height: 80px;
            position: relative;
        }

        .server-box {
            width: 100%;
            height: 25px;
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            border: 1px solid #00ff88;
            border-radius: 3px;
            margin-bottom: 5px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        .server-light {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .light-blink {
            background: #00ff88;
            animation: blink 1s infinite;
        }

        .light-off {
            background: #333;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; box-shadow: 0 0 10px #00ff88; }
            51%, 100% { opacity: 0.3; box-shadow: none; }
        }

        .server-lines {
            margin-left: auto;
            display: flex;
            gap: 3px;
        }

        .server-line {
            width: 15px;
            height: 3px;
            background: #333;
            border-radius: 1px;
        }

        h1 {
            font-size: 2rem;
            color: #00ff88;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .typing-effect {
            overflow: hidden;
            white-space: nowrap;
            animation: typing 3s steps(40) infinite;
        }

        @keyframes typing {
            0%, 100% { width: 0; }
            50%, 90% { width: 100%; }
        }

        .message {
            color: #888;
            font-size: 0.95rem;
            line-height: 1.8;
            margin: 25px 0;
        }

        .code-block {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 3px;
            padding: 20px;
            margin: 25px 0;
            text-align: left;
            font-size: 0.85rem;
        }

        .code-line {
            margin: 8px 0;
            display: flex;
        }

        .code-prefix {
            color: #00ccff;
            margin-right: 10px;
        }

        .code-text {
            color: #00ff88;
        }

        .code-loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .progress-bar-container {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 3px;
            height: 25px;
            overflow: hidden;
            margin: 25px 0;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            width: 0%;
            animation: progress 4s ease-in-out infinite;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            animation: shimmer 1.5s infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 85%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: #fff;
            z-index: 1;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 25px;
            border: 1px solid #ffbd2e;
            color: #ffbd2e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 189, 46, 0.3); }
            50% { box-shadow: 0 0 20px rgba(255, 189, 46, 0.6); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ff88;
            border-radius: 50%;
            animation: particleFloat 10s infinite linear;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }
    </style>
</head>

        function changeLanguage(lang) {

            document.getElementById('message').textContent = t.message;
            document.getElementById('code1').textContent = t.code1;
            document.getElementById('code2').textContent = t.code2;
            document.getElementById('code3').textContent = t.code3;
            document.getElementById('progressText').textContent = t.progress;
            document.getElementById('status').textContent = t.status;
            document.documentElement.lang = lang;
            
            if (lang === 'ar') {
                document.body.style.direction = 'rtl';
            } else {
                document.body.style.direction = 'ltr';
            }
        }

        document.getElementById('languageSelect').value = 'en';
    </script>
</body>
</html>

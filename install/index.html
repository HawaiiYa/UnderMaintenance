<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <title>安裝 QAT 網頁除錯工具</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b14;
      --card: rgba(20, 27, 45, 0.82);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f7f9ff;
      --muted: #9aa7bd;
      --accent: #6c8cff;
      --accent-2: #a66cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(108, 140, 255, 0.24), transparent 38%),
        radial-gradient(circle at 100% 80%, rgba(166, 108, 255, 0.18), transparent 42%),
        var(--bg);
    }

    main {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .hero,
    .steps {
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .hero {
      padding: 32px 24px 26px;
      border-radius: 28px;
      text-align: center;
    }

    .icon {
      display: grid;
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      place-items: center;
      border-radius: 22px;
      color: white;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 15px 35px rgba(108, 140, 255, 0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 7vw, 40px);
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 0 auto 24px;
      color: var(--muted);
      line-height: 1.65;
    }

    .install-button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 15px;
      color: white;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 28px rgba(108, 140, 255, 0.28);
    }

    .preview-link {
      display: inline-block;
      margin-top: 18px;
      color: #b8c6ff;
      text-decoration: none;
    }

    .steps {
      margin-top: 18px;
      padding: 24px;
      border-radius: 24px;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    ol {
      display: grid;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: step;
    }

    li {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 12px;
      align-items: start;
      color: var(--muted);
      line-height: 1.55;
      counter-increment: step;
    }

    li::before {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-size: 14px;
      font-weight: 700;
      content: counter(step);
      background: rgba(108, 140, 255, 0.24);
      border: 1px solid rgba(136, 159, 255, 0.35);
    }

    strong {
      color: var(--text);
    }

    .note {
      margin: 18px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: #7f8ba0;
      font-size: 13px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="icon" aria-hidden="true">QAT</div>
      <h1>安裝網頁除錯工具</h1>
      <p class="lead">在 iPhone 主畫面加入 QAT，快速輸入、貼上並開啟任何測試網址。</p>
      <a class="install-button" href="../app.mobileconfig">下載 iPhone 描述檔</a>
      <a class="preview-link" href="../app/">先開啟網頁版</a>
    </section>

    <section class="steps">
      <h2>安裝方式</h2>
      <ol>
        <li><span>使用 <strong>Safari</strong> 開啟此頁，點擊「下載 iPhone 描述檔」並允許下載。</span></li>
        <li><span>開啟 iPhone 的 <strong>設定</strong>，點擊「已下載描述檔」。</span></li>
        <li><span>依畫面指示完成安裝，主畫面會出現 <strong>QAT</strong>。</span></li>
      </ol>
      <p class="note">此描述檔只會安裝一個可移除的 Web Clip，不會取得裝置管理權限。</p>
    </section>
  </main>
</body>
</html>

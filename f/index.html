<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance, We'll Be Back Soon!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #fef9f3 0%, #ffecd2 50%, #fcb69f 100%);
            overflow: hidden;
            position: relative;
        }

        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: floatCloud 30s linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud-1 {
            width: 100px;
            height: 40px;
            top: 10%;
            left: -150px;
            animation-duration: 35s;
        }
        .cloud-1::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud-1::after { width: 35px; height: 35px; top: -15px; left: 55px; }

        .cloud-2 {
            width: 120px;
            height: 50px;
            top: 25%;
            left: -180px;
            animation-duration: 40s;
            animation-delay: 5s;
        }
        .cloud-2::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .cloud-2::after { width: 45px; height: 45px; top: -20px; left: 65px; }

        .cloud-3 {
            width: 80px;
            height: 35px;
            top: 5%;
            left: -120px;
            animation-duration: 45s;
            animation-delay: 10s;
        }
        .cloud-3::before { width: 40px; height: 40px; top: -20px; left: 10px; }
        .cloud-3::after { width: 30px; height: 30px; top: -12px; left: 45px; }

        @keyframes floatCloud {
            from { transform: translateX(0); }
            to { transform: translateX(calc(100vw + 200px)); }
        }

        .container {
            text-align: center;
            padding: 50px 40px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(252, 182, 159, 0.3);
            max-width: 550px;
            margin: 20px;
            position: relative;
            z-index: 10;
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 25px;
        }

        .language-selector select {
            padding: 10px 18px;
            border: 2px solid #fcb69f;
            border-radius: 20px;
            background: white;
            color: #e07b5a;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .language-selector select:hover {
            background: #fcb69f;
            color: white;
        }

        .illustration {
            margin: 20px auto 30px;
            position: relative;
            width: 200px;
            height: 180px;
        }

        /* Cute Robot */
        .robot {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .robot-body {
            width: 100px;
            height: 80px;
            background: linear-gradient(180deg, #a8e6cf, #88d8b0);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 10px 20px rgba(136, 216, 176, 0.3);
        }

        .robot-head {
            width: 80px;
            height: 60px;
            background: linear-gradient(180deg, #a8e6cf, #88d8b0);
            border-radius: 20px 20px 15px 15px;
            position: absolute;
            top: -50px;
            left: 10px;
            box-shadow: 0 5px 15px rgba(136, 216, 176, 0.3);
        }

        .robot-eye {
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 18px;
            animation: blink 3s infinite;
        }

        .robot-eye::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            left: 5px;
        }

        .robot-eye.left { left: 15px; }
        .robot-eye.right { right: 15px; }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .robot-mouth {
            width: 20px;
            height: 10px;
            border: 3px solid #333;
            border-top: none;
            border-radius: 0 0 15px 15px;
            position: absolute;
            bottom: 12px;
            left: 30px;
        }

        .robot-antenna {
            width: 4px;
            height: 20px;
            background: #88d8b0;
            position: absolute;
            top: -18px;
            left: 38px;
            border-radius: 2px;
        }

        .robot-antenna::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #ff6b6b;
            border-radius: 50%;
            position: absolute;
            top: -8px;
            left: -4px;
            animation: glow 1.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px #ff6b6b; }
            50% { box-shadow: 0 0 20px #ff6b6b, 0 0 30px #ff6b6b; }
        }

        .robot-arm {
            width: 15px;
            height: 40px;
            background: #88d8b0;
            border-radius: 10px;
            position: absolute;
            top: 10px;
        }

        .robot-arm.left {
            left: -20px;
            animation: waveLeft 2s ease-in-out infinite;
            transform-origin: top center;
        }

        .robot-arm.right {
            right: -20px;
            animation: waveRight 2s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes waveLeft {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        @keyframes waveRight {
            0%, 100% { transform: rotate(10deg); }
            50% { transform: rotate(-10deg); }
        }

        .robot-leg {
            width: 20px;
            height: 25px;
            background: #88d8b0;
            border-radius: 0 0 10px 10px;
            position: absolute;
            bottom: -20px;
        }

        .robot-leg.left { left: 20px; }
        .robot-leg.right { right: 20px; }

        /* Tools around robot */
        .tool {
            position: absolute;
            animation: float 3s ease-in-out infinite;
        }

        .wrench {
            width: 30px;
            height: 30px;
            top: 20px;
            left: 10px;
            animation-delay: 0s;
        }

        .wrench::before {
            content: '🔧';
            font-size: 28px;
        }

        .gear-tool {
            width: 30px;
            height: 30px;
            top: 30px;
            right: 10px;
            animation-delay: 0.5s;
        }

        .gear-tool::before {
            content: '⚙️';
            font-size: 28px;
            animation: spin 4s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            font-size: 16px;
            animation: sparkle 2s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: 10%; left: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 20%; right: 15%; animation-delay: 0.3s; }
        .sparkle:nth-child(3) { bottom: 30%; left: 10%; animation-delay: 0.6s; }
        .sparkle:nth-child(4) { bottom: 20%; right: 20%; animation-delay: 0.9s; }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 2.2rem;
            color: #e07b5a;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .message {
            color: #888;
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .hearts {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .heart {
            font-size: 24px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .heart:nth-child(2) { animation-delay: 0.2s; }
        .heart:nth-child(3) { animation-delay: 0.4s; }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .status-text {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #a8e6cf, #88d8b0);
            color: white;
            border-radius: 25px;
            display: inline-block;
            font-weight: 600;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="clouds">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <div class="container">
        <div class="language-selector">
            <select id="languageSelect" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="ar">العربية</option>
                <option value="hi">हिंदी</option>
                <option value="sw">Kiswahili</option>
                <option value="rw">Kinyarwanda</option>
                <option value="ht">Kreyòl Ayisyen</option>
                <option value="nl">Nederlands</option>
                <option value="sv">Svenska</option>
                <option value="da">Dansk</option>
                <option value="no">Norsk</option>
                <option value="fi">Suomi</option>
                <option value="pl">Polski</option>
                <option value="tr">Türkçe</option>
                <option value="th">ไทย</option>
                <option value="vi">Tiếng Việt</option>
            </select>
        </div>

        <div class="illustration">
            <div class="sparkles">
                <span class="sparkle">✨</span>
                <span class="sparkle">✨</span>
                <span class="sparkle">✨</span>
                <span class="sparkle">✨</span>
            </div>
            <div class="tool wrench"></div>
            <div class="tool gear-tool"></div>
            <div class="robot">
                <div class="robot-body">
                    <div class="robot-arm left"></div>
                    <div class="robot-arm right"></div>
                    <div class="robot-leg left"></div>
                    <div class="robot-leg right"></div>
                </div>
                <div class="robot-head">
                    <div class="robot-antenna"></div>
                    <div class="robot-eye left"></div>
                    <div class="robot-eye right"></div>
                    <div class="robot-mouth"></div>
                </div>
            </div>
        </div>

        <h1 id="title">We'll Be Back Soon!</h1>
        <p class="message" id="message">Our friendly robots are working hard to make things better. Thank you for your patience!</p>

        <div class="hearts">
            <span class="heart">💚</span>
            <span class="heart">💚</span>
            <span class="heart">💚</span>
        </div>

        <div class="status-text" id="status">Making things awesome!</div>
    </div>

    <script>
        const translations = {
            en: {
                title: "We'll Be Back Soon!",
                message: "Our friendly robots are working hard to make things better. Thank you for your patience!",
                status: "Making things awesome!"
            },
            es: {
                title: "¡Volveremos Pronto!",
                message: "Nuestros amigables robots están trabajando duro para mejorar las cosas. ¡Gracias por su paciencia!",
                status: "¡Haciendo las cosas geniales!"
            },
            fr: {
                title: "Nous Revenons Bientôt!",
                message: "Nos robots sympathiques travaillent dur pour améliorer les choses. Merci de votre patience!",
                status: "On rend tout génial!"
            },
            de: {
                title: "Wir Sind Bald Zurück!",
                message: "Unsere freundlichen Roboter arbeiten hart daran, die Dinge zu verbessern. Danke für Ihre Geduld!",
                status: "Wir machen alles toll!"
            },
            it: {
                title: "Torneremo Presto!",
                message: "I nostri simpatici robot stanno lavorando duramente per migliorare le cose. Grazie per la pazienza!",
                status: "Rendiamo tutto fantastico!"
            },
            pt: {
                title: "Voltaremos Em Breve!",
                message: "Nossos robôs amigáveis estão trabalhando duro para melhorar as coisas. Obrigado pela paciência!",
                status: "Deixando tudo incrível!"
            },
            ru: {
                title: "Мы Скоро Вернемся!",
                message: "Наши дружелюбные роботы усердно работают над улучшением. Спасибо за терпение!",
                status: "Делаем всё круто!"
            },
            ja: {
                title: "まもなく復旧します！",
                message: "私たちのロボットが一生懸命作業しています。しばらくお待ちください！",
                status: "素敵にしています！"
            },
            ko: {
                title: "곧 돌아올게요!",
                message: "우리의 친절한 로봇들이 열심히 일하고 있습니다. 기다려 주셔서 감사합니다!",
                status: "멋지게 만드는 중!"
            },
            ar: {
                title: "سنعود قريباً!",
                message: "روبوتاتنا الودودة تعمل بجد لتحسين الأمور. شكراً لصبركم!",
                status: "نجعل الأمور رائعة!"
            },
            hi: {
                title: "हम जल्द वापस आएंगे!",
                message: "हमारे मित्रवत रोबोट चीजों को बेहतर बनाने के लिए कड़ी मेहनत कर रहे हैं। आपके धैर्य के लिए धन्यवाद!",
                status: "सब कुछ शानदार बना रहे हैं!"
            },
            sw: {
                title: "Tutarudi Hivi Karibuni!",
                message: "Roboti zetu rafiki zinafanya kazi kwa bidii kuboresha mambo. Asante kwa uvumilivu wako!",
                status: "Tunafanya mambo kuwa mazuri!"
            },
            rw: {
                title: "Tuzagaruka Vuba!",
                message: "Robo zacu nziza zirimo gukora cyane kugira ngo ibintu bibe byiza. Murakoze kubihangana!",
                status: "Turimo gutunganya neza!"
            },
            ht: {
                title: "Nou Pral Tounen Byento!",
                message: "Robo zanmi nou yo ap travay di pou amelyore bagay yo. Mèsi pou pasyans ou!",
                status: "N ap fè bagay yo bèl!"
            },
            nl: {
                title: "We Zijn Zo Terug!",
                message: "Onze vriendelijke robots werken hard om alles te verbeteren. Bedankt voor uw geduld!",
                status: "We maken alles geweldig!"
            },
            sv: {
                title: "Vi Är Snart Tillbaka!",
                message: "Våra vänliga robotar arbetar hårt för att förbättra saker. Tack för ditt tålamod!",
                status: "Gör allt fantastiskt!"
            },
            da: {
                title: "Vi Er Snart Tilbage!",
                message: "Vores venlige robotter arbejder hårdt på at forbedre tingene. Tak for din tålmodighed!",
                status: "Gør alt fantastisk!"
            },
            no: {
                title: "Vi Er Snart Tilbake!",
                message: "Våre vennlige roboter jobber hardt for å forbedre ting. Takk for tålmodigheten!",
                status: "Gjør alt fantastisk!"
            },
            fi: {
                title: "Palaamme Pian!",
                message: "Ystävälliset robottimme työskentelevät kovasti parantaakseen asioita. Kiitos kärsivällisyydestäsi!",
                status: "Teemme kaiken mahtavaksi!"
            },
            pl: {
                title: "Wrócimy Wkrótce!",
                message: "Nasze przyjazne roboty ciężko pracują, aby wszystko ulepszyć. Dziękujemy za cierpliwość!",
                status: "Robimy wszystko super!"
            },
            tr: {
                title: "Yakında Döneceğiz!",
                message: "Dost canlısı robotlarımız işleri iyileştirmek için çok çalışıyor. Sabrınız için teşekkürler!",
                status: "Her şeyi harika yapıyoruz!"
            },
            th: {
                title: "เราจะกลับมาเร็วๆ นี้!",
                message: "หุ่นยนต์ที่เป็นมิตรของเรากำลังทำงานหนักเพื่อทำให้สิ่งต่างๆ ดีขึ้น ขอบคุณสำหรับความอดทนของคุณ!",
                status: "กำลังทำให้ทุกอย่างยอดเยี่ยม!"
            },
            vi: {
                title: "Chúng Tôi Sẽ Sớm Quay Lại!",
                message: "Các robot thân thiện của chúng tôi đang làm việc chăm chỉ để cải thiện mọi thứ. Cảm ơn sự kiên nhẫn của bạn!",
                status: "Đang làm mọi thứ tuyệt vời!"
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('message').textContent = t.message;
            document.getElementById('status').textContent = t.status;
            document.documentElement.lang = lang;
            
            if (lang === 'ar') {
                document.body.style.direction = 'rtl';
            } else {
                document.body.style.direction = 'ltr';
            }
        }

        document.getElementById('languageSelect').value = 'en';
    </script>
</body>
</html>
